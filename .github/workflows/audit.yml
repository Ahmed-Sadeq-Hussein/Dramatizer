# audit.yml | Known vulnerabilities in the packages CI installs (pip-audit). Dependencies change rarely, so
# this runs once a week and when a requirements file changes, not on every push.
name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC
  push:
    branches: [main]
    paths: ["requirements*.txt"]
  pull_request:
    paths: ["requirements*.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683       # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.10"
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit the CI packages
        run: pip-audit -r requirements-ci.txt
