# audit.yml | Known vulnerabilities in the packages CI installs (pip-audit). Dependencies change rarely, so
# this runs once a week and when a requirements file changes, not on every push.
#
# Every finding is printed. The run fails on any vulnerable package EXCEPT the ones in ACCEPTED below, which
# have no fixed version that installs on Python 3.10 (CosyVoice needs 3.10). They are pulled in by other
# packages, not chosen by us:
#   pillow   (via matplotlib)      fix is 13.0.0, Python >= 3.11. We only write PNG charts of our own numbers;
#                                  no image from outside is ever opened.
#   filelock (via huggingface_hub) fix is 4.2.1, Python >= 3.11. Only used for the local download cache, on
#                                  our own machine.
# Remove an entry as soon as its fix installs (moving to Python 3.11 removes both).
name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC
  push:
    branches: [main]
    paths: ["requirements*.txt", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["requirements*.txt", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCEPTED: "pillow filelock"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803       # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.10"
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit the CI packages
        run: |
          pip-audit -r requirements-ci.txt -f json -o audit.json || true
          python - <<'PY'
          import json, os, sys
          accepted = set(os.environ["ACCEPTED"].split())
          bad = 0
          for dep in json.load(open("audit.json"))["dependencies"]:
              vulns = dep.get("vulns") or []
              if not vulns:
                  continue
              fixes = sorted({f for v in vulns for f in v["fix_versions"]})
              known = dep["name"].lower() in accepted
              bad += not known
              print(f"{'ACCEPTED' if known else 'FAIL    '} {dep['name']} {dep['version']}: "
                    f"{len(vulns)} advisories, fixed in {', '.join(fixes) or 'nothing yet'}")
              print("         " + " ".join(v["id"] for v in vulns))
          sys.exit(1 if bad else 0)
          PY
