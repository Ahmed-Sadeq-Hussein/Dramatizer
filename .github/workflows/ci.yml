# ci.yml | Milestone 4, step 1: lint and every test that needs no GPU, on pull requests and pushes to main.
#
# Kept small on purpose (GitHub Actions minutes):
#   - one job on one Linux machine; a run is about 1-2 minutes with the pip cache
#   - only requirements-ci.txt is installed: no PyTorch, CUDA, models or voice data (tests that need them skip)
#   - no run when only documents change, and a newer push cancels the run still going on the same branch
#   - no secrets and no Hugging Face access: nothing here downloads data or models
# A failing step fails the run; later steps (an image, in step 2) must depend on this job.
name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "paper/**", "reports/**", "research_notes/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "paper/**", "reports/**", "research_notes/**", "LICENSE"]
  workflow_dispatch:            # Actions tab > CI > Run workflow

permissions:
  contents: read                # read the code; nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions pinned to a full commit (the tag can be moved; the commit cannot)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803       # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (CPU only, no models)
        run: python -m pip install -r requirements-ci.txt ruff==0.17.2
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python main_backend.py test

  # Milestone 4, step 2: the app image (docker/app.Dockerfile), only after the tests pass and only on main.
  # It is built on dramatizer-base, which is built by hand on the GPU computer (it is 8-10 GB) and whose digest
  # is written in deploy/base-image.txt. Until that file exists this job only says so.
  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write           # push to ghcr.io; only this job has it
    env:
      IMAGE: ghcr.io/ahmed-sadeq-hussein/dramatizer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803       # v6.1.0
        with:
          persist-credentials: false
      - name: Which base image
        id: base
        run: |
          if [ ! -s deploy/base-image.txt ]; then
            echo "No deploy/base-image.txt yet: build and push dramatizer-base first (docker/base.Dockerfile)." >> "$GITHUB_STEP_SUMMARY"
            echo "ref=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ref=$(grep -v '^#' deploy/base-image.txt | head -n1 | tr -d '[:space:]')
          case "$ref" in *@sha256:*) ;; *) echo "deploy/base-image.txt must name the base by digest (…@sha256:…)"; exit 1;; esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Make room (the base image is large)
        if: steps.base.outputs.ref != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Log in to ghcr.io
        if: steps.base.outputs.ref != ''
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        if: steps.base.outputs.ref != ''
        run: |
          docker build -f docker/app.Dockerfile \
            --build-arg BASE_IMAGE="${{ steps.base.outputs.ref }}" --build-arg GIT_COMMIT="${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" .
      - name: No secrets or data in the image
        if: steps.base.outputs.ref != ''
        run: |
          found=$(docker run --rm --entrypoint sh "$IMAGE:${{ github.sha }}" -c \
            'find /app \( -name ".env*" -o -name "*.pem" -o -name "*.key" -o -name "*.db" -o -name "*.wav" \
               -o -name "*.parquet" -o -name "*secret*" -o -name "test_users.txt" -o -name "passwords_to_hand_out.txt" \) -print')
          if [ -n "$found" ]; then echo "Found in the image:"; echo "$found"; exit 1; fi
          echo "Nothing secret or private in /app."
      - name: Push, and record the digest
        if: steps.base.outputs.ref != ''
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "Image: \`$digest\`  (base: \`${{ steps.base.outputs.ref }}\`)" >> "$GITHUB_STEP_SUMMARY"
