<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dramatizer">
  <title>Dramatizer</title>
  <!-- The Dramatizer's mask, from the team's sketch: two slanted brows and a wide grin split in the middle -->
  <defs>
    <!-- magenta, light to dark: top to bottom, saturation 80% to 70% (20-30% below full), lightness 42% to 24% -->
    <linearGradient id="mask-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c115c1"/>
      <stop offset="1" stop-color="#681268"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#mask-bg)"/>
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M14 18 L27 24.5"/>
    <path d="M50 18 L37 24.5"/>
  </g>
  <g fill="#ffffff">
    <path d="M11.5 33 Q15 51 30 54 L30 45.5 Q19 43.5 11.5 33 Z"/>
    <path d="M52.5 33 Q49 51 34 54 L34 45.5 Q45 43.5 52.5 33 Z" transform="rotate(180 43.25 43.5)"/>
  </g>
</svg>
