# ruff.toml | The lint checked by CI (.github/workflows/ci.yml): `ruff check .`
# The rules are listed, not left to ruff's defaults: newer ruff versions turn on many more rules by default,
# so the same code passed with ruff 0.15 and failed with 0.17. These are the classic defaults (syntax errors,
# undefined names, unused imports and variables), minus two this project uses on purpose: short lambdas given
# a name (E731) and one-letter names like `l` in loops (E741).
target-version = "py310"
line-length = 120
extend-exclude = ["private", "frontend/ui_versions"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]
